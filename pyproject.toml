[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-gateway-local"
version = "1.0.0"
description = "🌐 Unified local AI gateway for OpenAI, Anthropic, Gemini, and Ollama with built-in routing."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Varun Ruhella" }]
keywords = ["ai", "gateway", "llm", "proxy", "ollama", "openai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "litellm",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
omni-gateway = "omni_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/varungor365/omni-gateway-local"
Repository = "https://github.com/varungor365/omni-gateway-local"
